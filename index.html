<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Solar Movie Viewer</title>
<style>
  :root{
    --bg:#000000;
    --panel:rgba(16,16,20,.86);
    --line:rgba(255,255,255,.14);
    --text:#e8e6e1;
    --dim:#9b978f;
    --accent:#e4573d; /* follows selected channel */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;position:fixed;width:100%}
  #stage{position:absolute;inset:0;touch-action:none}
  canvas{display:block;width:100%;height:100%}

  /* top panel */
  #top{position:absolute;top:0;left:0;right:0;background:var(--panel);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
  #chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
    margin-right:44px}       /* clear of the hide button */
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);border-radius:14px;
    padding:5px 12px;color:var(--dim);background:transparent;font-size:13px}
  .chip.on{color:#000;font-weight:600;border-color:transparent}
  #opts{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
  select,button{font:inherit;color:var(--text);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;appearance:none}
  button:active{background:rgba(255,255,255,.16)}
  #loadBtn{background:var(--accent);border-color:transparent;color:#000;font-weight:600}
  #status{color:var(--dim);font-size:12px;margin-top:6px;min-height:15px}

  /* bottom transport */
  #bottom{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
  #transport{display:flex;align-items:center;gap:10px}
  #playBtn{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    font-size:16px;display:flex;align-items:center;justify-content:center}
  #scrub{flex:1;accent-color:var(--accent)}
  input[type=range]{height:28px}
  #row2{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px;color:var(--dim)}
  #stamp{flex:1;white-space:pre-line;line-height:1.35;min-height:2.7em}
  #fps{width:90px;accent-color:var(--accent)}
  .mini{padding:4px 9px;font-size:12px;border-radius:7px}
  .mini.on{background:var(--accent);border-color:transparent;color:#000;font-weight:600}

  #banner{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;display:none;text-align:left}
  #banner b{display:block;margin-bottom:6px}
  #banner p{color:var(--dim);font-size:13px}

  /* DEM color key: tall in the room beside the disk on a landscape screen,
     wide in the room under it on a portrait one. Gestures pass through, and
     it hides with the controls. */
  #cbar{display:none}
  #cbar.on{display:block}
  body.bare #cbar{display:none}
  #cbar img{position:absolute;right:4px;top:50%;transform:translateY(-50%);
    height:min(400px,50vh);background:var(--panel);border-radius:10px;pointer-events:none}
  @media (orientation: portrait){
    #cbar img{right:auto;left:50%;top:auto;bottom:calc(var(--bottom-h, 96px) + 6px);
      transform:translateX(-50%);height:auto;width:min(400px,92vw)}
  }

  #toggleTop{position:absolute;right:10px;background:transparent;border:none;
    color:var(--dim);font-size:12px;padding:6px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<picture id="cbar"><source id="cbarWide" media="(orientation: portrait)"><img id="cbarTall" alt="DEM color key"></picture>

<div id="top">
  <button id="toggleTop">hide</button>
  <div id="chips"></div>
  <div id="opts">
    <select id="dur">
      <option value="6" selected>6 h</option>
      <option value="12">12 h</option>
      <option value="24">24 h</option>
      <option value="48">48 h</option>
    </select>
    <select id="nf">
      <option value="24" selected>24 frames</option>
      <option value="48">48 frames</option>
      <option value="96">96 frames</option>
    </select>
    <select id="res">
      <option value="512">512 px</option>
      <option value="1024" selected>1k px</option>
      <option value="2048">2k px</option>
      <option value="4096">4k px</option>
    </select>
    <button id="loadBtn">Load movie</button>
    <button id="hdBtn" class="mini">Sharpen view</button>
    <button id="fitBtn" class="mini">Fit disk</button>
    <button id="trackBtn" class="mini">Track rotation</button>
    <button id="labelBtn" class="mini">Label regions</button>
  </div>
  <div id="status"></div>
</div>

<div id="bottom">
  <div id="transport">
    <button id="playBtn">&#9654;</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1">
  </div>
  <div id="row2">
    <span id="stamp">no data loaded</span>
    <span id="fpsLbl">12 fps</span>
    <input id="fps" type="range" min="2" max="30" value="12" step="1">
  </div>
</div>

<div id="banner">
  <b>Couldn't reach api.helioviewer.org</b>
  <p>If you're viewing this inside a sandboxed preview, external requests may be
  blocked. Save this file and open it in Safari or Chrome, then reload. The
  Helioviewer server itself can also be briefly down; retrying later helps.</p>
</div>

<script>
"use strict";

/* ---------- channels (standard AIA colormap hues for the chips) ---------- */
/* Layers are requested by Helioviewer source id rather than by spelling out
   observatory/instrument/detector, since AIA and HMI do not name those the
   same way. Ids come from the v2 getDataSources tree. The DEM channel is not
   from Helioviewer; see loadDem. */
const CHANNELS = [
  {id:10, label:"171",   name:"AIA 171",         native:0.6, c:"#f2b53e"},
  {id:11, label:"193",   name:"AIA 193",         native:0.6, c:"#d98a2b"},
  {id:12, label:"211",   name:"AIA 211",         native:0.6, c:"#c77ee0"},
  {id:13, label:"304",   name:"AIA 304",         native:0.6, c:"#e4573d"},
  {id:14, label:"335",   name:"AIA 335",         native:0.6, c:"#4f7bdc"},
  {id:9,  label:"131",   name:"AIA 131",         native:0.6, c:"#6fd8d3"},
  {id:8,  label:"94",    name:"AIA 94",          native:0.6, c:"#7fae4a"},
  {id:15, label:"1600",  name:"AIA 1600",        native:0.6, c:"#c9c94a"},
  {id:16, label:"1700",  name:"AIA 1700",        native:0.6, c:"#d7a8a0"},
  {id:19, label:"HMI B", name:"HMI magnetogram", native:0.5, c:"#b9b4ab"},
  {dem:true, label:"DEM", name:"AIA DEM",        native:2.4, c:"#6cc04a",
   bg:"linear-gradient(90deg,#5a6cff,#4cc04a,#ff5a3c)"},
];
const API = "https://api.helioviewer.org/v2/takeScreenshot/";
/* A link can choose what the viewer opens on: ?ch=DEM&dur=48&nf=96 picks the
   channel by its chip label (any case) and the duration and frame count by
   their menu values, and ?ar=1 turns on the region labels. Values not on the
   chips or menus are ignored. */
const PARAMS = new URLSearchParams(location.search);
/* Where the DEM frames and their manifest live; ?dem=URL points elsewhere,
   such as a local copy. */
const DEM_BASE = (PARAMS.get("dem")
  || "https://sun-data.github.io/aia-dem/").replace(/\/?$/, "/");
const DEM_SLOT = 180e3;       // ms between DEM frames, the cadence of the JSOC synoptic images
const DISK_SPAN = 2478;       // arcsec covered by full-disk request
const WORKERS = 12;           // server render time dominates, so loads scale with concurrency
function framePx(){ return +document.getElementById("res").value; }
function memWarn(n, w, h){
  const mb = n * w * h * 4 / 1e6;
  return mb > 500 ? " \u2014 ~" + Math.round(mb/100)/10 + " GB decoded, may crash mobile browsers" : "";
}

/* ---------- differential rotation ---------- */
/* Snodgrass (1984) sidereal rate for small magnetic features, degrees per day
   as a function of heliographic latitude. Swap the coefficients for another
   tracer: Allen (1973) photospheric is {A:14.44, B:-3.0, C:0}, and rigid
   Carrington rotation is {A:14.1844, B:0, C:0}. */
const ROT = {A:14.713, B:-2.396, C:-1.787};
const EARTH = 0.9856;         // deg / day, Earth's orbit: converts sidereal to synodic
const R_SUN = 959.63;         // arcsec, mean apparent solar radius at 1 AU
const I_SUN = 7.25 * Math.PI / 180;   // tilt of the solar rotation axis to the ecliptic

function rate(lat){           // synodic, degrees per day
  const s = Math.sin(lat);
  return ROT.A + ROT.B*s*s + ROT.C*s*s*s*s - EARTH;
}

/* Heliographic latitude of the disk center, Meeus chapter 29. The rotation
   axis leans up to 7.25 degrees toward or away from us over the year, so a
   feature moves in y as well as x as it rotates. Assuming B0 = 0 pins the
   apparent y and the tracker drifts off vertically, by about 20 arcsec a day
   near the limb. */
function b0Of(date){
  const jd = date.getTime() / 86400e3 + 2440587.5;
  const T = (jd - 2451545) / 36525;
  const L0 = 280.46646 + 36000.76983 * T;
  const M = (357.52911 + 35999.05029 * T) * Math.PI / 180;
  const C = (1.914602 - 0.004817*T) * Math.sin(M)
          + 0.019993 * Math.sin(2*M) + 0.000289 * Math.sin(3*M);
  const node = (125.04 - 1934.136 * T) * Math.PI / 180;
  const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(node)) * Math.PI / 180;
  const K = (73.6667 + 1.3958333 * (jd - 2396758) / 36525) * Math.PI / 180;
  return Math.asin(Math.sin(lam - K) * Math.sin(I_SUN));
}

/* Advance a helioprojective point by `days` of differential rotation, through
   heliographic coordinates so the tilt is carried properly. Orthographic, and
   B0 is held at its value on the pinned frame, which drifts about 0.1 degrees
   a day and so costs a few arcsec across a long window. Longitude is clamped
   at the terminator, so a feature reaching the limb parks there rather than
   jumping. Returns null only when the point is off the disk. */
function rotate(x, y, days, b0){
  if (Math.hypot(x, y) > R_SUN) return null;
  const xr = x / R_SUN, yr = y / R_SUN;
  const zr = Math.sqrt(Math.max(0, 1 - xr*xr - yr*yr));
  const cb = Math.cos(b0), sb = Math.sin(b0);
  const lat = Math.asin(Math.max(-1, Math.min(1, yr*cb + zr*sb)));
  const cl = Math.cos(lat), sl = Math.sin(lat);
  let lon = Math.atan2(xr, zr*cb - yr*sb) + rate(lat) * days * Math.PI / 180;
  const edge = -Math.tan(lat) * Math.tan(b0);   // cos(lon) where the point sets
  if (Math.abs(edge) < 1){
    const max = Math.acos(edge);
    lon = Math.max(-max, Math.min(max, lon));
  }
  return {x: R_SUN * cl * Math.sin(lon), y: R_SUN * (sl*cb - cl*sb*Math.cos(lon))};
}

/* Tracking de-rotates every frame to one reference time rather than pinning a
   single point, so the view never moves, the limb stays put, and the whole
   disk is stabilized instead of one feature with everything shearing past it. */
function toggleTrack(){
  if (track) track = null;
  else {
    const f = frameAt(idx);
    if (!f) return;
    track = f.date;
  }
  document.getElementById("trackBtn").classList.toggle("on", !!track);
  draw();
}

/* ---------- active region labels ---------- */
/* NOAA SWPC serves its daily Solar Region Summaries for the last 30 days as
   JSON, with CORS open. The entry dated D gives every numbered region's
   heliographic position, to the nearest degree, at 24:00 UT on D: it is the
   report issued at 00:30 UT the next day. The entry for the current day is
   still being compiled, so a frame is labeled from the last entry dated
   before its UT day, rotated on to the frame time at the tracker's rates. A
   label can step by a few arcsec at 00 UT when the next report takes over,
   and a region numbered today is labeled from tomorrow. When tracking, the
   labels go where the regions are at the reference time instead, to stay on
   the de-rotated disk. Regions behind the limb are left off. */
const REGIONS = "https://services.swpc.noaa.gov/json/solar_regions.json";
let labels = false;
let reports = {};             // UT date -> [{num, lat, lon}], radians, longitude positive west

async function loadRegions(){
  try {
    const r = await fetch(REGIONS);
    if (!r.ok) throw new Error(r.status);
    const by = {};
    for (const g of await r.json()){
      (by[g.observed_date] = by[g.observed_date] || []).push({
        num: 10000 + g.region,                  // NOAA has counted mod 10000 since 2002
        lat: g.latitude * Math.PI / 180,
        lon: -g.longitude * Math.PI / 180});    // reported positive east
    }
    reports = by;
  } catch {
    labels = false;
    document.getElementById("labelBtn").classList.remove("on");
    setStatus("couldn't load the region labels from NOAA");
  }
  draw();
}

/* Fetched afresh each time they are turned on, which is how a page left open
   picks up the next day's report. */
function toggleLabels(){
  labels = !labels;
  document.getElementById("labelBtn").classList.toggle("on", labels);
  if (labels) loadRegions();
  draw();
}

/* A dot marks each region's reported position and its number sits just north
   of the dot, clear of the region's core. A number that would
   overlap one already drawn, as for neighbors foreshortened near the limb,
   goes under its dot instead, or else stacks further north. */
function drawLabels(f){
  const day = f.date.toISOString().slice(0, 10);
  const d = Object.keys(reports).filter(k => k < day).sort().pop();
  if (!d) return;
  const when = track || f.date;
  const days = (when - Date.parse(d + "T00:00:00Z")) / 86400e3 - 1;   // from 24:00 UT on d
  const b0 = b0Of(when), cb = Math.cos(b0), sb = Math.sin(b0);
  ctx.font = "600 12px system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.lineJoin = "round"; ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.fillStyle = "#fff";
  const drawn = [];             // {x, b, w}: center, baseline and width of each number
  for (const g of reports[d]){
    const lon = g.lon + rate(g.lat) * days * Math.PI / 180;
    const cl = Math.cos(g.lat), sl = Math.sin(g.lat);
    if (sl*sb + cl*cb*Math.cos(lon) <= 0) continue;
    const x = W/2 + (R_SUN * cl * Math.sin(lon) - view.cx) / view.spp;
    const y = H/2 - (R_SUN * (sl*cb - cl*sb*Math.cos(lon)) - view.cy) / view.spp;
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 2*Math.PI);
    ctx.stroke(); ctx.fill();
    const w = ctx.measureText(g.num).width + 4;
    const clear = b => drawn.every(o => Math.abs(o.x - x) > (o.w + w)/2 || Math.abs(o.b - b) > 13);
    let b = y - 5;
    for (let k = 1; !clear(b); k++) b = k === 1 ? y + 18 : y - 5 - 13*(k - 1);
    drawn.push({x, b, w});
    ctx.strokeText(g.num, x, b);
    ctx.fillText(g.num, x, b);
  }
}

/* ---------- state ---------- */
let chan = CHANNELS.find(c => c.label.toLowerCase() === (PARAMS.get("ch") || "").toLowerCase())
  || CHANNELS[3];             // AIA 304
let frames = [];              // {img, date}
let meta = null;              // {scale, cx, cy, w, h} of current frame set
let idx = 0, playing = false, fps = 12, lastTick = 0;
let view = {cx:0, cy:0, spp:1};   // arcsec center + arcsec per CSS px
let track = null;             // date the view center was pinned to, or null
let loadToken = 0;

/* ---------- canvas ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  document.documentElement.style.setProperty("--bottom-h",
    document.getElementById("bottom").offsetHeight + "px");
  draw();
}
window.addEventListener("resize", resize);

function fitDisk(){
  view.cx = 0; view.cy = 0;
  view.spp = 2200 / Math.min(W, H);   // disk ≈1920″ + margin
  draw();
}

/* While a sequence is still loading it is a sparse array, so index maps to a
   fixed time slot and gaps fall back to the closest frame already in hand. */
function frameAt(i){
  if (frames[i]) return frames[i];
  for (let d = 1; d < frames.length; d++){
    if (frames[i-d]) return frames[i-d];
    if (frames[i+d]) return frames[i+d];
  }
  return null;
}

let MESH = 16;                // warp grid per axis; see the note on accuracy below

/* Untracked, or on the reference frame itself: one straight blit. */
function plain(img){
  const dw = meta.w * meta.scale / view.spp;
  const dh = meta.h * meta.scale / view.spp;
  ctx.drawImage(img, W/2 + (meta.cx - view.cx)/view.spp - dw/2,
                     H/2 - (meta.cy - view.cy)/view.spp - dh/2, dw, dh);
}

/* One mesh triangle. Canvas 2D can only apply affine transforms, so the warp
   is built from many small affine pieces, each fitted to a triangle's three
   source-to-screen correspondences. Passing a null source draws that triangle
   unwarped. */
function tri(img, a, b, c, A, B, C){
  ctx.save();
  const mx = (a[0]+b[0]+c[0])/3, my = (a[1]+b[1]+c[1])/3, g = 1.01;
  ctx.beginPath();                       // grown a hair so neighbours leave no seam
  ctx.moveTo(mx + (a[0]-mx)*g, my + (a[1]-my)*g);
  ctx.lineTo(mx + (b[0]-mx)*g, my + (b[1]-my)*g);
  ctx.lineTo(mx + (c[0]-mx)*g, my + (c[1]-my)*g);
  ctx.closePath();
  ctx.clip();
  const d = A ? (A[0]-C[0])*(B[1]-C[1]) - (B[0]-C[0])*(A[1]-C[1]) : 0;
  if (A && Math.abs(d) > 1e-9){
    const m11 = ((a[0]-c[0])*(B[1]-C[1]) - (b[0]-c[0])*(A[1]-C[1])) / d;
    const m21 = ((b[0]-c[0])*(A[0]-C[0]) - (a[0]-c[0])*(B[0]-C[0])) / d;
    const m12 = ((a[1]-c[1])*(B[1]-C[1]) - (b[1]-c[1])*(A[1]-C[1])) / d;
    const m22 = ((b[1]-c[1])*(A[0]-C[0]) - (a[1]-c[1])*(B[0]-C[0])) / d;
    ctx.transform(m11, m12, m21, m22,
                  c[0] - m11*C[0] - m21*C[1], c[1] - m12*C[0] - m22*C[1]);
    ctx.drawImage(img, 0, 0);
  } else {
    plain(img);
  }
  ctx.restore();
}

/* De-rotate a frame to the reference time. For every mesh node: screen ->
   helioprojective -> heliographic -> advance the longitude at the local rate
   -> project back -> source pixel. Cells touching the limb are drawn unwarped,
   because the map is singular there and a finer mesh does not converge. */
function warp(img, days, b0){
  const n = MESH, sx = [], sy = [], ux = [], uy = [], ok = [];
  for (let i = 0; i <= n; i++) sx.push(W * i / n);
  for (let j = 0; j <= n; j++) sy.push(H * j / n);
  for (let j = 0; j <= n; j++){
    for (let i = 0; i <= n; i++){
      const x = view.cx + (sx[i] - W/2) * view.spp;
      const y = view.cy - (sy[j] - H/2) * view.spp;
      const p = rotate(x, y, days, b0);
      ok.push(p ? 1 : 0);
      ux.push(((p ? p.x : x) - meta.cx)/meta.scale + meta.w/2);
      uy.push((meta.cy - (p ? p.y : y))/meta.scale + meta.h/2);
    }
  }
  for (let j = 0; j < n; j++){
    for (let i = 0; i < n; i++){
      const k = j*(n+1)+i, r = k+n+1;
      const S = [[sx[i],sy[j]], [sx[i+1],sy[j]], [sx[i],sy[j+1]], [sx[i+1],sy[j+1]]];
      const T = (ok[k] && ok[k+1] && ok[r] && ok[r+1])
        ? [[ux[k],uy[k]], [ux[k+1],uy[k+1]], [ux[r],uy[r]], [ux[r+1],uy[r+1]]]
        : [null, null, null, null];
      tri(img, S[0], S[1], S[2], T[0], T[1], T[2]);
      tri(img, S[1], S[3], S[2], T[1], T[3], T[2]);
    }
  }
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  const f = frameAt(idx);
  if (!f || !meta) return;
  ctx.imageSmoothingEnabled = (meta.scale / view.spp) < 1.5; // crisp when deeply zoomed
  const days = track ? (f.date - track) / 86400e3 : 0;
  if (days) warp(f.img, days, b0Of(track));
  else plain(f.img);
  if (labels) drawLabels(f);
}

/* ---------- gestures: pan / pinch / double-tap / wheel ---------- */
const ptrs = new Map();
let lastMid = null, lastDist = 0, lastTapT = 0, lastTapX = 0, lastTapY = 0;

function zoomAbout(px, py, factor){
  const ax = view.cx + (px - W/2) * view.spp;
  const ay = view.cy - (py - H/2) * view.spp;
  view.spp = Math.min(Math.max(view.spp / factor, 0.05), 20);
  view.cx = ax - (px - W/2) * view.spp;
  view.cy = ay + (py - H/2) * view.spp;
  draw();
}

const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){
    const t = performance.now();
    if (t - lastTapT < 300 && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY) < 30){
      zoomAbout(e.clientX, e.clientY, 2);
      lastTapT = 0;
    } else { lastTapT = t; lastTapX = e.clientX; lastTapY = e.clientY; }
  }
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    lastDist = Math.hypot(a.x-b.x, a.y-b.y);
    lastMid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  }
});
stage.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){
    view.cx -= (e.clientX - prev.x) * view.spp;
    view.cy += (e.clientY - prev.y) * view.spp;   // screen y is down, solar y is up
    draw();
  } else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    if (lastDist > 0) zoomAbout(mid.x, mid.y, d / lastDist);
    view.cx -= (mid.x - lastMid.x) * view.spp;
    view.cy += (mid.y - lastMid.y) * view.spp;
    lastDist = d; lastMid = mid;
    draw();
  }
});
function drop(e){ ptrs.delete(e.pointerId); lastDist = 0; }
stage.addEventListener("pointerup", drop);
stage.addEventListener("pointercancel", drop);
stage.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAbout(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.002));
}, {passive:false});
document.addEventListener("gesturestart", e => e.preventDefault());

/* ---------- loading ---------- */
function urlFor(date, scale, cx, cy, w, h){
  return API + "?date=" + date.toISOString().replace(/\.\d{3}Z$/, "Z")
    + "&imageScale=" + scale
    + "&layers=[" + chan.id + ",1,100]"
    + "&x0=" + cx.toFixed(1) + "&y0=" + cy.toFixed(1)
    + "&width=" + w + "&height=" + h
    + "&display=true&watermark=false";
}

function loadImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("load failed"));
    img.src = src;
  });
}

/* Helioviewer's JSON answers carry no CORS header, so fetch can't read them,
   but it wraps them in a callback on request (JSONP), which a script element
   can load. */
function jsonp(url){
  return new Promise((res, rej) => {
    const name = "hv" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const done = () => { clearTimeout(timer); window[name] = () => {}; s.remove(); };
    const timer = setTimeout(() => { done(); rej(new Error("timeout")); }, 10e3);
    window[name] = v => { done(); res(v); };
    s.onerror = () => { done(); rej(new Error("load failed")); };
    s.src = url + "&callback=" + name;
    document.head.appendChild(s);
  });
}

/* The time of the newest image Helioviewer has of the channel. Its ingest
   runs behind real time, tens of minutes for AIA and at times hours for HMI,
   and a movie ending now would repeat that image in every frame after it,
   each stamped with a time it was not taken. Now, if Helioviewer doesn't
   say. */
async function newest(){
  try {
    const r = await jsonp("https://api.helioviewer.org/v2/getClosestImage/?date="
      + new Date().toISOString().replace(/\.\d{3}Z$/, "Z") + "&sourceId=" + chan.id);
    const t = Date.parse(r.date.replace(" ", "T") + "Z");
    if (Number.isFinite(t)) return Math.min(t, Date.now());
  } catch {}
  return Date.now();
}

/* Evenly spaced times over the chosen window, ending at `end`. */
function recent(end){
  const n = +document.getElementById("nf").value;
  const hours = +document.getElementById("dur").value;
  const step = hours * 3600e3 / (n - 1);
  return Array.from({length:n}, (_, i) => new Date(end - (n-1-i) * step));
}

async function loadSequence(newMeta, label, dates, urls){
  const token = ++loadToken;
  const n = dates.length;

  setStatus(label + " 0/" + n);
  document.getElementById("banner").style.display = "none";

  /* Workers fill `out` in place. The first frame to land swaps it in as the
     live sequence and starts playback, so the canvas fills at roughly the
     latency of one request rather than of the whole set. Until then the
     previous movie keeps playing, and a load that fails outright leaves it
     untouched. */
  const out = new Array(n);
  let done = 0, errs = 0, cursor = 0, live = false;
  const worker = async () => {
    while (cursor < n){
      const i = cursor++;
      if (token !== loadToken) return;
      try {
        const img = await loadImage(urls[i]);
        if (token !== loadToken) return;
        out[i] = {img, date: dates[i]};
        if (!live){
          live = true;
          frames = out; meta = newMeta; idx = i;
          document.getElementById("cbar").classList.toggle("on", !!chan.dem);
          const scrub = document.getElementById("scrub");
          scrub.max = n - 1; scrub.value = i;
          updateStamp();
          if (!playing) togglePlay();
        }
        if (frameAt(idx) === out[i]) draw();
      } catch { errs++; }
      done++;
      if (token === loadToken) setStatus(label + " " + done + "/" + n);
    }
  };
  await Promise.all(Array.from({length:WORKERS}, () => worker()));
  if (token !== loadToken) return;

  const ok = out.filter(Boolean);
  if (ok.length === 0){
    setStatus("no frames loaded");
    const banner = document.getElementById("banner");
    banner.style.display = "block";
    if (chan.dem){ demBanner(); return; }
    try {
      await fetch("https://api.helioviewer.org/v2/getStatus/", {mode:"no-cors"});
      banner.innerHTML = "<b>Server reached, but images failed to load</b>" +
        "<p>api.helioviewer.org is reachable, so this is likely a temporary " +
        "server-side issue or an unsupported response in this browser. " +
        "Try Load movie again, or a different channel.</p>";
    } catch {
      banner.innerHTML = "<b>Network requests are blocked here</b>" +
        "<p>This viewer (sandboxed preview or file preview) is not allowing " +
        "requests to api.helioviewer.org. Open the file in a full browser: " +
        "on Android, open it with Chrome from your Downloads; on iOS, the " +
        "Files preview blocks scripts \u2014 host the file somewhere " +
        "(e.g. GitHub Pages) and open that URL in Safari.</p>";
    }
    return;
  }
  setStatus(ok.length + " frames" + (errs ? " (" + errs + " failed)" : ""));
  if (BENCH) runBench();
}

async function loadFrames(m, label){
  const token = ++loadToken;
  setStatus(label);
  const end = await newest();
  if (token !== loadToken) return;
  const dates = recent(end);
  loadSequence(m, label + memWarn(dates.length, m.w, m.h), dates,
    dates.map(d => urlFor(d, m.scale, m.cx, m.cy, m.w, m.h)));
}

function loadFullDisk(){
  const px = framePx();
  if (chan.dem) loadDem(px);
  else loadFrames({scale: Math.max(chan.native, DISK_SPAN / px), cx:0, cy:0, w:px, h:px}, "loading");
  fitDisk();
}

/* The DEM channel is baked rather than requested. A scheduled job inverts
   the JSOC AIA synoptic images (2.4 arcsec/px, every 3 minutes) with
   utu.dem.plowman, colors them with colorsynth (hue for temperature,
   brightness for DEM, on one fixed scale for every frame), and publishes the
   last 48 hours as full-disk JPEGs at a few sizes plus a manifest. So the
   window ends on the newest frame rather than now, and the size is the
   smallest one at least `px` across. The frames are spaced by a whole number
   of slots, as near the window over the frame count as that allows without
   going over, so a short window gets more frames than asked for rather than
   an uneven movie: 96 frames over 6 hours is 3.75 minutes apart, so it gets
   every slot, 120 frames. Each of these times gets the frame nearest it, the
   one in its slot once the window is filled in; where frames are missing,
   as while the job is catching up, two times can share a frame and it is
   shown once. The manifest changes every 15 minutes, so it is refetched on
   every load; the frames never change once written. */
async function loadDem(px){
  const token = ++loadToken;
  setStatus("loading DEM manifest");
  document.getElementById("banner").style.display = "none";
  let m;
  try {
    const r = await fetch(new URL("manifest.json", DEM_BASE), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    m = await r.json();
    if (!m.frames.length) throw new Error("no frames");
  } catch {
    if (token === loadToken){ setStatus("no frames loaded"); demBanner(); }
    return;
  }
  if (token !== loadToken) return;
  const sizes = Object.keys(m.size).sort((a, b) => m.size[a] - m.size[b]);
  const level = sizes.find(s => m.size[s] >= px) || sizes[sizes.length-1];
  const span = +document.getElementById("dur").value * 3600e3;
  const step = DEM_SLOT * Math.max(1, Math.floor(span / +document.getElementById("nf").value / DEM_SLOT));
  const n = Math.floor(span / step);
  const times = m.frames.map(f => Date.parse(f.time));
  const end = times[times.length-1];
  const picked = [];
  for (let i = 0, j = 0; i < n; i++){
    const t = end - (n-1-i) * step;
    while (j + 1 < times.length && Math.abs(times[j+1] - t) <= Math.abs(times[j] - t)) j++;
    if (picked[picked.length-1] !== m.frames[j]) picked.push(m.frames[j]);
  }
  const preset = m.presets[0];
  document.getElementById("cbarTall").src = new URL(preset.colorbar, DEM_BASE).href;
  document.getElementById("cbarWide").srcset = new URL(preset.colorbar_wide, DEM_BASE).href;
  const w = m.size[level];
  loadSequence({scale: m.scale[level], cx: m.center[0], cy: m.center[1], w, h: w},
    "loading DEM" + memWarn(picked.length, w, w),
    picked.map(f => new Date(f.time)),
    picked.map(f => new URL(preset.path.replace("{level}", level).replace("{name}", f.name), DEM_BASE).href));
}

function demBanner(){
  const banner = document.getElementById("banner");
  banner.style.display = "block";
  banner.innerHTML = "<b>Couldn't load the DEM frames</b><p></p>";
  banner.querySelector("p").textContent = "Nothing came back from " + DEM_BASE
    + ". The site may be briefly down; retrying later helps.";
}

function sharpenView(){
  if (!meta){ loadFullDisk(); return; }
  if (chan.dem){ loadDem(Infinity); return; }   // full disk only: take the largest size
  const px = framePx();
  let spanX = view.spp * W, spanY = view.spp * H;
  if (track){
    /* Every frame is requested on the same center, so widen the tile to cover
       the drift, or the tracked feature walks out of it across the window. */
    const hours = +document.getElementById("dur").value;
    let pad = 0;
    for (const days of [-hours/24, hours/24]){
      const p = rotate(view.cx, view.cy, days, b0Of(track));
      if (p) pad = Math.max(pad, Math.hypot(p.x - view.cx, p.y - view.cy));
    }
    spanX += 2*pad; spanY += 2*pad;
  }
  let scale = Math.max(chan.native, Math.max(spanX, spanY) / px);
  const w = Math.min(4096, Math.round(spanX / scale));
  const h = Math.min(4096, Math.round(spanY / scale));
  loadFrames({scale, cx: view.cx, cy: view.cy, w, h}, "sharpening (" + scale.toFixed(2) + "\u2033/px)");
}

/* ---------- transport ---------- */
function togglePlay(){
  playing = !playing;
  document.getElementById("playBtn").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
}
function tick(t){
  if (playing && frames.length > 1 && t - lastTick > 1000 / fps){
    lastTick = t;
    idx = (idx + 1) % frames.length;
    document.getElementById("scrub").value = idx;
    updateStamp(); draw();
  }
  requestAnimationFrame(tick);
}
/* The frame time in UT, and under it in the viewer's own time zone with how
   long ago that was, which moves on while paused too. */
function updateStamp(){
  const f = frameAt(idx);
  if (!f) return;
  const min = Math.max(0, Math.floor((Date.now() - f.date) / 60e3));
  document.getElementById("stamp").textContent =
    chan.name + " \u00b7 " + f.date.toISOString().slice(0, 16).replace("T", " ") + " UT\n"
    + f.date.toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit", timeZoneName:"short"})
    + " \u00b7 " + (min < 60 ? "" : Math.floor(min / 60) + " h ") + min % 60 + " min ago";
}
setInterval(updateStamp, 20e3);

/* ---------- benchmark ---------- */
/* Load with ?bench to time the render path once frames are in, on this device
   rather than in the abstract. Reports the plain blit and the de-rotating warp
   separately, since only the second one scales with mesh size. */
const BENCH = location.search.indexOf("bench") >= 0;

/* Canvas 2D draws are deferred, so timing a drawImage call measures command
   submission rather than raster work, and the usual flush (getImageData) is
   unavailable because cross-origin frames taint the canvas. So drive real
   animation frames and count them: the wall-clock number includes compositing
   and is what playback actually gets, capped by the display refresh. */
function rafBench(n, reps){
  reps = reps || 1;
  return new Promise(resolve => {
    let i = 0, t0 = 0;
    function step(ts){
      if (i === 0) t0 = ts;
      if (i >= n){
        const wall = ts - t0;
        resolve({fps:+(1000*n/wall).toFixed(1), frame_ms:+(wall/n).toFixed(2),
                 draws_per_frame: reps,
                 per_draw_ms:+(wall/(n*reps)).toFixed(3)});
        return;
      }
      for (let r = 0; r < reps; r++){ idx = (i*reps + r) % frames.length; draw(); }
      i++;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* Every configuration sits at vsync when drawing once per frame, so push more
   draws into each frame until the refresh cap breaks. The rep count at which
   fps falls away is the headroom over real playback. */
async function saturate(meshOrZero){
  if (meshOrZero){ MESH = meshOrZero; const f0 = frameAt(0); track = f0 ? f0.date : null; }
  else track = null;
  const out = [];
  for (const reps of [1, 2, 4, 8, 16, 32]){
    await rafBench(10, reps);
    const r = await rafBench(60, reps);
    out.push(r);
    if (r.fps < 30) break;
  }
  return out;
}

async function runBench(){
  const wasTrack = track, wasIdx = idx, wasMesh = MESH, wasPlaying = playing;
  const wasView = Object.assign({}, view);
  playing = false;
  const res = {canvas:[cv.width, cv.height], dpr:DPR,
               tile: meta ? [meta.w, meta.h] : null,
               frames: frames.filter(Boolean).length, full_disk:{}, zoomed:{}};
  for (const m of [0, 8, 16, 32]) res.full_disk[m ? "mesh"+m : "blit"] = await saturate(m);
  view.cx = 400; view.cy = 250; view.spp = 300 / Math.min(W, H);
  res.zoom_spp = +view.spp.toFixed(4);
  for (const m of [0, 16]) res.zoomed[m ? "mesh"+m : "blit"] = await saturate(m);
  Object.assign(view, wasView);
  track = wasTrack; idx = wasIdx; MESH = wasMesh; playing = wasPlaying;
  draw();
  const w16 = res.full_disk.mesh16;
  setStatus("warp16 holds vsync to " + w16[w16.length-1].draws_per_frame + " draws/frame");
  try {
    await fetch("/bench", {method:"POST", headers:{"Content-Type":"application/json"},
                           body: JSON.stringify(res)});
  } catch {}
}

/* ---------- UI wiring ---------- */
const chipBox = document.getElementById("chips");
for (const ch of CHANNELS){
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = ch.label;
  b.onclick = () => {
    chan = ch;
    document.documentElement.style.setProperty("--accent", ch.c);
    for (const el of chipBox.children) el.classList.remove("on"), el.style.background = "";
    b.classList.add("on"); b.style.background = ch.bg || ch.c;
    loadFullDisk();
  };
  chipBox.appendChild(b);
  if (ch === chan){ b.classList.add("on"); b.style.background = ch.bg || ch.c;
    document.documentElement.style.setProperty("--accent", ch.c);
    b.scrollIntoView({block:"nearest", inline:"nearest"}); }   // the chip row scrolls on a phone
}
for (const id of ["dur", "nf"]){
  const menu = document.getElementById(id), v = PARAMS.get(id);
  if ([...menu.options].some(o => o.value === v)) menu.value = v;
}
document.getElementById("loadBtn").onclick = loadFullDisk;
document.getElementById("hdBtn").onclick = sharpenView;
document.getElementById("fitBtn").onclick = fitDisk;
document.getElementById("trackBtn").onclick = toggleTrack;
document.getElementById("labelBtn").onclick = toggleLabels;
if (PARAMS.get("ar") === "1") toggleLabels();
document.getElementById("playBtn").onclick = togglePlay;
document.getElementById("scrub").oninput = e => {
  idx = +e.target.value; playing = false;
  document.getElementById("playBtn").innerHTML = "&#9654;";
  updateStamp(); draw();
};
document.getElementById("fps").oninput = e => {
  fps = +e.target.value;
  document.getElementById("fpsLbl").textContent = fps + " fps";
};
document.getElementById("toggleTop").onclick = e => {
  const chips = document.getElementById("chips"),
        opts = document.getElementById("opts"),
        st = document.getElementById("status");
  const hidden = chips.style.display === "none";
  chips.style.display = opts.style.display = st.style.display = hidden ? "" : "none";
  document.body.classList.toggle("bare", !hidden);
  e.target.textContent = hidden ? "hide" : "controls";
};
function setStatus(s){ document.getElementById("status").textContent = s; }

/* ---------- go: what the link asks for, else 6 h of He II 304 ---------- */
resize(); fitDisk();
requestAnimationFrame(tick);
loadFullDisk();
</script>
